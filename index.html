<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WebForge</title><link rel="stylesheet" href="./src/ui/styles.css"><link rel="stylesheet" href="./src/ui/architecture.css"><style>
.component-library{padding:10px;border-top:1px solid #242938}.component-library-title{padding:4px 4px 8px;color:#aeb7c9;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.08em}.component-library-list{display:grid;gap:6px}.component-library-item{display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px;border:1px solid #293044;border-radius:7px;background:#181d29;color:#e4e9f4;cursor:pointer}.component-library-item:hover{border-color:#7c5cff}.component-library-item span{font-size:10px;color:#818ba1}.component-library-empty{font-size:10px;line-height:1.45;color:#717b90;padding:6px}
.webforge-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:stretch;justify-content:center;background:rgba(3,6,12,.72);backdrop-filter:blur(4px)}.webforge-modal{width:min(1180px,94vw);height:min(760px,92vh);margin:auto;background:#111520;border:1px solid #303649;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}.webforge-modal-head{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #242938}.webforge-modal-title{font-size:14px;font-weight:800}.webforge-modal-subtitle{font-size:11px;color:#818ba1}.webforge-modal-spacer{flex:1}.webforge-modal-close{border:1px solid #303649;background:#181d29;color:#dfe5f2;border-radius:7px;padding:6px 10px;cursor:pointer}.webforge-modal-body{flex:1;min-height:0;overflow:auto;padding:16px}.preview-frame{width:100%;height:100%;border:0;background:#fff;border-radius:8px}.component-modal-grid{display:grid;grid-template-columns:260px 1fr;gap:16px;height:100%}.component-modal-list{border:1px solid #293044;border-radius:9px;padding:10px;overflow:auto}.component-modal-list button{width:100%;display:flex;justify-content:space-between;padding:9px 10px;margin-bottom:6px;border:1px solid #293044;background:#181d29;color:#e4e9f4;border-radius:7px;cursor:pointer}.component-modal-list button.active{border-color:#7c5cff;background:#211c38}.component-modal-detail{border:1px solid #293044;border-radius:9px;padding:18px;overflow:auto}.component-modal-detail h2{margin:0 0 5px}.component-modal-detail p{color:#9da6ba;font-size:12px}.component-meta{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #242938;font-size:12px}.component-meta code{color:#cbd3e2}.component-empty{height:100%;display:grid;place-items:center;color:#717b90}.asset-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.asset-toolbar .asset-count{color:#818ba1;font-size:11px}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.asset-card{border:1px solid #293044;border-radius:9px;background:#181d29;padding:10px;display:grid;gap:7px}.asset-preview{height:120px;border-radius:7px;background:#0c111a;border:1px solid #293044;display:grid;place-items:center;overflow:hidden;color:#717b90;font-size:10px}.asset-preview img{width:100%;height:100%;object-fit:cover}.asset-card strong{font-size:12px}.asset-card code{font-size:9px;color:#818ba1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.asset-use,.asset-delete{border:1px solid #303649;background:#181d29;color:#dfe5f2;border-radius:6px;padding:6px;cursor:pointer}.asset-use{border-color:#6a56c8;background:#211c38}.responsive-controls{display:flex;align-items:center;gap:4px;padding-left:10px;border-left:1px solid #242938}.responsive-controls button{border:1px solid #303649;background:#151a25;color:#8d97ab;border-radius:5px;padding:5px 8px;font-size:10px;cursor:pointer}.responsive-controls button.active{background:#252038;color:#fff;border-color:#7c5cff}.responsive-status{font-size:9px;color:#818ba1;min-width:78px;text-transform:capitalize;padding-left:4px}
</style></head>
<body>
<header class="topbar"><div class="brand"><span class="logo">W</span><span>WebForge</span><span class="version-badge" id="versionBadge">v22</span></div><div class="history"><button id="undoBtn">↶</button><button id="redoBtn">↷</button></div><div class="project-name">Untitled Project</div><div class="actions"><button id="architectureBtn">Architecture</button><button id="componentsBtn">Components</button><button id="assetsBtn">Assets</button><button id="previewBtn">Preview</button><button id="generateBtn" class="primary">Generate Code</button><button id="exportBtn">Export</button></div></header>
<div class="app-tabs"><button class="tab active">Visual</button><button class="tab">Structure</button><button class="tab">Code</button></div>
<main class="workspace">
<aside class="panel left-panel">
<div class="panel-title">Pages</div><div class="page-actions"><button id="addPage">＋ Page</button></div><div id="pages" class="pages"></div>
<div class="panel-title tree-title">Elements</div><div class="elements"><button class="element" draggable="true" data-type="section">▣ Section</button><button class="element" draggable="true" data-type="heading">T Heading</button><button class="element" draggable="true" data-type="text">¶ Text</button><button class="element" draggable="true" data-type="button">▭ Button</button><button class="element" draggable="true" data-type="image">▧ Image</button></div>
<div class="component-library" id="componentLibrary"></div>
<div class="panel-title tree-title">Layers</div><div id="layerTree" class="tree"></div><div class="panel-title tree-title">Project Files</div><div id="fileTree" class="file-tree"></div>
</aside>
<section class="canvas-wrap"><div class="canvas-toolbar"><div class="device-switch"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><div id="responsiveControls" class="responsive-controls" aria-label="Responsive layout mode"><button data-responsive-mode="lock-layout" title="Keep the selected element layout locked across devices">🔒 Lock Layout</button><button data-responsive-mode="auto-adjust" title="Let the selected element adapt to the current device">🪄 Auto Adjust</button><button data-responsive-mode="make-individually" title="Keep separate styles for each device">🎯 Make Individually</button><span id="responsiveStatus" class="responsive-status">Select an element</span></div><span id="selectionInfo">Nothing selected</span><span id="viewportInfo">1200px</span></div><div id="canvas" class="canvas"><div class="drop-hint">Drag an element here to start building</div></div></section>
<aside class="panel right-panel"><div class="panel-title">Code</div><div class="code-head"><span id="activeFile">frontend/pages/Home.html</span><button id="saveFile">Save</button></div><textarea id="codeEditor" spellcheck="false" class="code-editor"></textarea><div class="panel-title inspector-title">Inspector</div><div id="inspector" class="inspector"><p>Select an element to edit its properties.</p></div></aside>
</main>
<script type="module" src="./src/ui/app.js"></script>
<script type="module">
import { WEBFORGE_VERSION_LABEL } from './src/version.js';
import { generateProjectDownload } from './src/ui/projectGenerator.js';
import { createArchitectureView } from './src/ui/architectureView.js';
import { mountComponentLibrary, getComponentRegistry } from './src/ui/componentBridge.js';
import { openAssetManager } from './src/ui/assetManager.js';
import './src/ui/responsiveControls.js';
const versionBadge=document.querySelector('#versionBadge'); if(versionBadge)versionBadge.textContent=WEBFORGE_VERSION_LABEL;
document.querySelector('#generateBtn')?.addEventListener('click', generateProjectDownload);
const overlay=(title,subtitle,content)=>{const root=document.createElement('div');root.className='webforge-overlay';root.innerHTML=`<div class="webforge-modal"><div class="webforge-modal-head"><div class="webforge-modal-title">${title}</div><div class="webforge-modal-subtitle">${subtitle||''}</div><div class="webforge-modal-spacer"></div><button class="webforge-modal-close">Close</button></div><div class="webforge-modal-body"></div></div>`;root.querySelector('.webforge-modal-body').appendChild(content);root.querySelector('.webforge-modal-close').onclick=()=>root.remove();root.onclick=e=>{if(e.target===root)root.remove()};document.body.appendChild(root);return root;};
let architectureRoot=null;
document.querySelector('#architectureBtn')?.addEventListener('click',()=>{if(!window.webforge?.getGraph)return;architectureRoot?.remove();const view=createArchitectureView(()=>window.webforge.getGraph());architectureRoot=overlay('Architecture','Live project graph and structure',view);view.addEventListener('architecture:close',()=>architectureRoot?.remove());});
document.querySelector('#componentsBtn')?.addEventListener('click',()=>{const wrap=document.createElement('div');wrap.className='component-modal-grid';const list=document.createElement('div');list.className='component-modal-list';const detail=document.createElement('div');detail.className='component-modal-detail';wrap.append(list,detail);const render=selected=>{const registry=getComponentRegistry();const items=Object.values(registry.components||{});list.innerHTML='';if(!items.length){list.innerHTML='<div class="component-empty">No reusable components yet.</div>';detail.innerHTML='<div class="component-empty">Create components from the Components tools.</div>';return;}items.forEach(c=>{const b=document.createElement('button');b.className=c.id===selected?'active':'';b.innerHTML=`<span>◇ ${c.name}</span><span>${c.instances||0}</span>`;b.onclick=()=>render(c.id);list.appendChild(b);});const c=registry.components[selected]||items[0];detail.innerHTML=`<h2>${c.name}</h2><p>Reusable component definition</p><div class="component-meta"><span>Source</span><code>frontend/components/${c.slug}.html</code></div><div class="component-meta"><span>Instances</span><strong>${c.instances||0}</strong></div><div class="component-meta"><span>Props</span><strong>${(c.props||[]).length}</strong></div><h3>Props</h3>${(c.props||[]).map(p=>`<div class="component-meta"><span>${p.name}</span><code>${p.type||'string'}</code></div>`).join('')}`;};render();overlay('Components','Reusable library without leaving the editor',wrap);});
document.querySelector('#assetsBtn')?.addEventListener('click',openAssetManager);
document.querySelector('#previewBtn')?.addEventListener('click',()=>{const canvas=document.querySelector('#canvas');const source=[...canvas.children].filter(el=>el.classList.contains('forge-node')).map(el=>{const c=el.cloneNode(true);c.querySelectorAll('.resize-handle').forEach(h=>h.remove());c.classList.remove('selected');return c.outerHTML;}).join('\n');const wrap=document.createElement('div');wrap.style.height='100%';const frame=document.createElement('iframe');frame.className='preview-frame';frame.setAttribute('sandbox','allow-scripts');frame.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}*{box-sizing:border-box}</style></head><body>${source}</body></html>`;wrap.appendChild(frame);overlay('Preview','Live canvas preview',wrap);});
const mount=()=>mountComponentLibrary(document.querySelector('#componentLibrary'),instance=>{window.dispatchEvent(new CustomEvent('webforge:component-selected',{detail:instance}));const canvas=document.querySelector('#canvas');if(canvas){const el=document.createElement('div');el.className='forge-node component-instance';el.dataset.componentId=instance.componentId;el.textContent=`◇ ${instance.componentId}`;el.style.padding='18px';el.style.margin='18px';el.style.border='1px solid #7c5cff';canvas.appendChild(el);}});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
window.addEventListener('webforge:generated',event=>{const files=Object.keys(event.detail.files||{}).length;const button=document.querySelector('#generateBtn');if(button){button.textContent=`Generated ${files} files ✓`;setTimeout(()=>button.textContent='Generate Code',1800);}});
</script>
</body></html>
