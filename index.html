<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WebForge</title><link rel="stylesheet" href="./src/ui/styles.css"><link rel="stylesheet" href="./src/ui/architecture.css"></head><body><header class="topbar"><div class="brand"><span class="logo">W</span><span>WebForge</span><span class="version-badge" id="versionBadge">v26</span></div><div class="history"><button id="undoBtn">↶</button><button id="redoBtn">↷</button></div><div class="project-name">Untitled Project</div><div class="actions"><button id="pageMapBtn">Page Map</button><button id="architectureBtn">Architecture</button><button id="componentsBtn">Components</button><button id="assetsBtn">Assets</button><button id="previewBtn">Preview</button><button id="generateBtn" class="primary">Generate Code</button><button id="exportBtn">Export</button></div></header><div class="app-tabs"><button class="tab active">Visual</button><button class="tab">Structure</button><button class="tab">Code</button></div><main class="workspace"><aside class="panel left-panel"><div class="panel-title">Pages</div><div class="page-actions"><button id="addPage">＋ Page</button></div><div id="pages" class="pages"></div><div class="panel-title tree-title">Elements</div><div class="elements"><button class="element" draggable="true" data-type="section">▣ Section</button><button class="element" draggable="true" data-type="heading">T Heading</button><button class="element" draggable="true" data-type="text">¶ Text</button><button class="element" draggable="true" data-type="button">▭ Button</button><button class="element" draggable="true" data-type="image">▧ Image</button></div><div class="component-library" id="componentLibrary"></div><div class="panel-title tree-title">Layers</div><div id="layerTree" class="tree"></div><div class="panel-title tree-title">Project Files</div><div id="fileTree" class="file-tree"></div></aside><section class="canvas-wrap"><div class="canvas-toolbar"><div class="device-switch"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><div id="responsiveControls" class="responsive-controls"><button data-responsive-mode="lock-layout">🔒 Lock Layout</button><button data-responsive-mode="auto-adjust">🪄 Auto Adjust</button><button data-responsive-mode="make-individually">🎯 Make Individually</button><span id="responsiveStatus" class="responsive-status">Select an element</span></div><span id="selectionInfo">Nothing selected</span><span id="viewportInfo">1200px</span></div><div id="canvas" class="canvas"><div class="drop-hint">Drag an element here to start building</div></div></section><aside class="panel right-panel"><div class="panel-title">Code</div><div class="code-head"><span id="activeFile">frontend/pages/Home.html</span><button id="saveFile">Save</button></div><textarea id="codeEditor" spellcheck="false" class="code-editor"></textarea><div class="panel-title inspector-title">Inspector</div><div id="inspector" class="inspector"><p>Select an element to edit its properties.</p></div></aside></main><script type="module" src="./src/ui/app.js"></script><script type="module">import{WEBFORGE_VERSION_LABEL}from'./src/version.js';import{generateProjectDownload}from'./src/ui/projectGenerator.js';import{openAssetManager}from'./src/ui/assetManager.js';import{mountComponentLibrary}from'./src/ui/componentBridge.js';import{openInteractivePageMap}from'./src/ui/pageMapV26.js';import'./src/ui/responsiveControls.js';const v=document.querySelector('#versionBadge');if(v)v.textContent=WEBFORGE_VERSION_LABEL;document.querySelector('#generateBtn')?.addEventListener('click',generateProjectDownload);document.querySelector('#pageMapBtn')?.addEventListener('click',openInteractivePageMap);document.querySelector('#assetsBtn')?.addEventListener('click',openAssetManager);const mount=()=>mountComponentLibrary(document.querySelector('#
