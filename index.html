<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WebForge</title><link rel="stylesheet" href="./src/ui/styles.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="logo">W</span><span>WebForge</span></div><div class="history"><button id="undoBtn">↶</button><button id="redoBtn">↷</button></div><div class="project-name">Untitled Project</div><div class="actions"><button id="previewBtn">Preview</button><button class="primary" id="exportBtn">Export</button></div></header>
<div class="app-tabs"><button class="tab active">Visual</button><button class="tab">Structure</button><button class="tab">Code</button></div>
<main class="workspace">
<aside class="panel left-panel">
<div class="panel-title">Pages</div><div class="page-actions"><button id="addPage">＋ Page</button></div><div id="pages" class="pages"></div>
<div class="panel-title tree-title">Elements</div><div class="elements"><button class="element" draggable="true" data-type="section">▣ Section</button><button class="element" draggable="true" data-type="heading">T Heading</button><button class="element" draggable="true" data-type="text">¶ Text</button><button class="element" draggable="true" data-type="button">▭ Button</button><button class="element" draggable="true" data-type="image">▧ Image</button></div>
<div class="panel-title tree-title">Layers</div><div id="layerTree" class="tree"></div><div class="panel-title tree-title">Project Files</div><div id="fileTree" class="file-tree"></div>
</aside>
<section class="canvas-wrap"><div class="canvas-toolbar"><div class="device-switch"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><span id="selectionInfo">Nothing selected</span><span id="viewportInfo">1200px</span></div><div id="canvas" class="canvas"><div class="drop-hint">Drag an element here to start building</div></div></section>
<aside class="panel right-panel"><div class="panel-title">Code</div><div class="code-head"><span id="activeFile">frontend/pages/Home.html</span><button id="saveFile">Save</button></div><textarea id="codeEditor" spellcheck="false" class="code-editor"></textarea><div class="panel-title inspector-title">Inspector</div><div id="inspector" class="inspector"><p>Select an element to edit its properties.</p></div></aside>
</main><script type="module" src="./src/ui/app.js"></script></body></html>
