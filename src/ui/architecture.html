<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebForge Architecture</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#090c12;color:#e9edf6}*{box-sizing:border-box}body{margin:0;min-height:100vh}.bar{height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #252a39;background:#111520}.brand{font-weight:800}.brand b{background:#7c5cff;padding:7px 10px;border-radius:7px;margin-right:8px}.wrap{max-width:1200px;margin:auto;padding:24px;display:grid;gap:18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}.muted{color:#8791a6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111520;border:1px solid #252a39;border-radius:10px;padding:16px}.metric{font-size:26px;font-weight:800;margin-top:6px}.panel{background:#111520;border:1px solid #252a39;border-radius:10px;overflow:hidden}.panel h3{margin:0;padding:13px 15px;border-bottom:1px solid #252a39;font-size:13px}.panel .body{padding:15px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1e2330;font-size:13px}.row:last-child{border-bottom:0}.pill{padding:4px 8px;border-radius:999px;background:#241d46;color:#cfc6ff;font-size:11px}.controls{display:flex;gap:8px}.controls input{flex:1;padding:10px;border:1px solid #303649;border-radius:7px;background:#0b0f17;color:#e8edf6}.controls button{padding:10px 14px;border:1px solid #7c5cff;background:#7c5cff;color:white;border-radius:7px;cursor:pointer}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.empty{color:#717b90;padding:12px 0}.warn{color:#ffc36b}.ok{color:#83e2a3}@media(max-width:800px){.grid,.cols{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}}@media(max-width:560px){.grid,.cols{grid-template-columns:1fr}}</style></head><body><header class="bar"><div class="brand"><b>W</b>WebForge Architecture Intelligence</div></header><main class="wrap"><section class="hero"><div><h1>Project Architecture</h1><div class="muted">Understand what WebForge should create, reuse and modify before generating source files.</div></div><div class="pill" id="type">Analyzing…</div></section><section class="grid" id="metrics"></section><section class="panel"><h3>Feature Architect</h3><div class="body"><div class="controls"><input id="request" placeholder="e.g. Add user login with API integration and dashboard"><button id="plan">Create Plan</button></div><div id="planOutput" class="empty">Enter a feature request to generate a structured change plan.</div></div></section><section class="cols"><div class="panel"><h3>Proposed Project Structure</h3><div class="body" id="files"></div></div><div class="panel"><h3>Reusable Components & Health</h3><div class="body" id="reuse"></div></div></section></main><script type="module">import {createProject,addEntity,getChildren} from '../core/projectGraph.js';import {analyzeArchitecture,planFeature} from '../core/architecturePlanner.js';let graph=createProject({name:'WebForge Demo'});graph=addEntity(graph,{type:'page',name:'Home',parentId:graph.projectId,data:{route:'/'}});let page=getChildren(graph,graph.projectId)[0];graph=addEntity(graph,{type:'element',name:'Hero Section',parentId:page.id,data:{type:'section',content:'<section><h1>Welcome</h1><p>Build visually.</p></section>',styles:{}}});graph=addEntity(graph,{type:'element',name:'Primary Button',parentId:page.id,data:{type:'button',content:'<button>Get Started</button>',styles:{}}});graph=addEntity(graph,{type:'element',name:'Primary Button',parentId:page.id,data:{type:'button',content:'<button>Get Started</button>',styles:{}}});const render=()=>{const a=analyzeArchitecture(graph);document.querySelector('#type').textContent=a.projectType;document.querySelector('#metrics').innerHTML=[['Pages',a.metrics.pages],['Visual Nodes',a.metrics.nodes],['Reusable Candidates',a.metrics.reusableCandidates],['Proposed Files',a.metrics.proposedFiles]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${v}</div></div>`).join('');document.querySelector('#files').innerHTML=a.proposedFiles.map(f=>`<div class="row"><span>${f.action.toUpperCase()} · ${f.path}</span><span class="muted">${f.reason}</span></div>`).join('');document.querySelector('#reuse').innerHTML=(a.reusableComponents.length?a.reusableComponents.map(c=>`<div class="row"><span>${c.name}</span><span class="pill">${c.instances.length} uses</span></div>`).join(''):'<div class="empty">No repeated component pattern detected.</div>')+(a.warnings.length?`<div class="warn" style="margin-top:12px">${a.warnings.join('<br>')}</div>`:'<div class="ok" style="margin-top:12px">Architecture looks clean for the current model.</div>')};document.querySelector('#plan').onclick=()=>{const p=planFeature(graph,document.querySelector('#request').value);document.querySelector('#planOutput').innerHTML=`<div class="row"><strong>Project type</strong><span>${p.projectType}</span></div><div class="row"><strong>Create</strong><span>${p.create.join(', ')}</span></div><div class="row"><strong>Modify</strong><span>${p.modify.join(', ')||'None'}</span></div><div class="row"><strong>Reuse</strong><span>${p.reuse.join(', ')||'None detected'}</span></div>${p.warnings.length?`<div class="warn" style="margin-top:12px">${p.warnings.join('<br>')}</div>`:''}`};render();</script></body></html>
